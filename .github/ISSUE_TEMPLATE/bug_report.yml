name: 🐛 Bug report
description: Something in a script or on the site isn't working.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where is the bug?
      options:
        - Gmail script (Google Apps Script)
        - Outlook script (PowerShell)
        - Apple Mail script (AppleScript)
        - Website / setup guide
        - Agent-facing files (llms.txt, AGENTS.md, raw scripts)
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: Page or URL where it happened
      placeholder: e.g. https://dontmailme.org/gmail
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: e.g. Gmail + Chrome on macOS, or Outlook 365 on Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy note
      options:
        - label: I have NOT pasted any private email content, addresses, or tokens in this report.
          required: true
